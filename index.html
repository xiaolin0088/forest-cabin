<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>森林小屋</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; }
  #app { position: fixed; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  body.ready #app { opacity: 1; }
  #app canvas { display: block; }
  #ui {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    background: linear-gradient(160deg, rgba(24, 32, 26, 0.62), rgba(14, 20, 16, 0.55));
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 18px; padding: 16px 18px 14px;
    color: #f2f5ee; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; pointer-events: none;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  #ui h1 {
    margin: 0 0 12px; font-size: 16px; font-weight: 600; letter-spacing: 1.5px;
    display: flex; align-items: center; gap: 8px;
  }
  #ui h1::after {
    content: ''; flex: 1; height: 1px; margin-left: 4px;
    background: linear-gradient(90deg, rgba(255, 180, 90, 0.5), transparent);
  }
  #ui .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  #ui .wbtn {
    pointer-events: auto;
    border: 1px solid rgba(255, 255, 255, 0.18); background: rgba(255, 255, 255, 0.07);
    color: #eef2ea; padding: 7px 13px; border-radius: 999px; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: all .22s ease;
    backdrop-filter: blur(4px);
  }
  #ui .wbtn:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
  #ui .wbtn.active {
    background: linear-gradient(135deg, #ffc15e, #f28e3b);
    border-color: rgba(255, 200, 120, 0.7); color: #2b1a08; font-weight: 600;
    box-shadow: 0 4px 18px rgba(242, 142, 59, 0.45);
  }
  #ui .hint { margin-top: 11px; font-size: 11px; opacity: 0.62; line-height: 1.6; letter-spacing: 0.4px; }
  #ui .hint b { color: #ffc15e; font-weight: 600; }
  /* 移动端：更紧凑的面板 + 更大的触控目标 */
  @media (max-width: 768px) {
    #ui {
      top: 10px; left: 10px; padding: 10px 12px 9px;
      border-radius: 14px; max-width: calc(100vw - 40px);
    }
    #ui h1 { font-size: 14px; margin-bottom: 9px; }
    #ui .btns { gap: 6px; }
    #ui .wbtn { padding: 10px 13px; font-size: 13px; min-height: 40px; }
    #ui .hint { font-size: 10px; margin-top: 9px; }
  }
  @media (max-width: 400px) {
    #ui .wbtn { padding: 9px 10px; font-size: 12px; min-height: 38px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>🌲 森林小屋</h1>
  <div class="btns">
    <button class="wbtn active" data-w="sunny">☀️ 晴天</button>
    <button class="wbtn" data-w="foggy">🌫️ 雾天</button>
    <button class="wbtn" data-w="sunset">🌇 黄昏</button>
    <button class="wbtn" data-w="night">🌙 夜晚</button>
    <button class="wbtn" data-w="rain">🌧️ 雨天</button>
  </div>
  <div class="hint">🖱 左键旋转 · 滚轮缩放 · 右键平移<br />⌨️ 按 <b>1</b>–<b>5</b> 快速切换天气</div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
